                const zkpWorker = new Worker('zkp-worker.js');

                        nilaiRahasiaPengguna: nilaiRahasiaPengguna,
                        hashIdentitasTerdaftar: hashIdentitasTerdaftar
                    },
                    wasmPath: `${SERVER_URL}/zkp/circuit_js/circuit.wasm`,
                    zkeyPath: `${SERVER_URL}/zkp/circuit_0000.zkey`
                });

                        const t1 = performance.now();

                        const kredensial = btoa(JSON.stringify({proof, publicSignals}));
                        tulisLog(`Bukti ZKP selesai dibuat (${(t1 - t0).toFixed(2)} ms), dikirim ke server...`);

            if (koneksiWebRTC) return;

            try {
                aliranLokal = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
                videoLokal.srcObject = aliranLokal;

                koneksiWebRTC = new RTCPeerConnection({iceServers: [{urls: 'stun:stun.l.google.com:19302'}]});
                aliranLokal.getTracks().forEach(track => koneksiWebRTC.addTrack(track, aliranLokal));

                koneksiWebRTC.ontrack = (e) => {
                    videoJauh.srcObject = e.streams[0];
                    tulisLog('Video diterima dari Peer A');
                };

                koneksiWebRTC.onicecandidate = (e) => {
                    if (e.candidate) socket.emit('ice-candidate', {tujuan: TARGET_ROUTING_ID, kandidat: e.candidate});
                };

                koneksiWebRTC.onconnectionstatechange = () => {
                    tulisLog('Status koneksi P2P: ' + koneksiWebRTC.connectionState);
                    if (koneksiWebRTC.connectionState === 'connected') {
                        ubahStatus('✅ Koneksi P2P dengan Peer A berhasil dibentuk', 'sukses');
                        window.__benchmark.status = 'selesai';
                    }
                    if (koneksiWebRTC.connectionState === 'failed') {
                        window.__benchmark.status = 'gagal';
                        window.__benchmark.error = 'connectionState failed';
                    }
                };
            } catch (err) {
                tulisLog(`❌ Kesalahan WebRTC: ${err.message}`);
                window.__benchmark.status = 'gagal';
                window.__benchmark.error = err.message;
            }
        }
    </script>
</body>

</html>
