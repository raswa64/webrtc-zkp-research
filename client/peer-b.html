<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peer B - Penerima Penawaran | WebRTC + ZKP</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 15px;
            background: #f5f7fa;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 22px;
        }

        .status {
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .info {
            background: #e3f2fd;
            color: #1565c0;
        }

        .sukses {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .gagal {
            background: #ffebee;
            color: #c62828;
        }

        .tombol {
            padding: 10px 18px;
            margin: 5px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .tombol.zkp {
            background: #9c27b0;
            color: white;
        }

        .tombol.jwt {
            background: #2196f3;
            color: white;
        }

        video {
            width: 100%;
            max-width: 420px;
            border-radius: 8px;
            margin: 10px 0;
            border: 2px solid #ddd;
            background: #000;
        }

        .konten {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .kolom {
            flex: 1;
            min-width: 280px;
        }

        .log {
            background: white;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ddd;
            height: 150px;
            overflow-y: auto;
            font-size: 13px;
            margin-top: 10px;
        }
    </style>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/snarkjs.min.js"></script>
</head>

<body>
    <h1>🔸 Klien B (Penerima Penawaran)</h1>
    <div id="status" class="status info">Siap — Pilih metode autentikasi</div>

    <div>
        <button id="btnJwt" class="tombol jwt" onclick="hubungkanJWT()">Hubungkan dengan JWT</button>
        <button id="btnZkp" class="tombol zkp" onclick="hubungkanZKP()">Hubungkan dengan ZKP Groth16</button>
    </div>

    <div class="konten">
        <div class="kolom">
            <h3>Video Saya</h3>
            <video id="videoLokal" autoplay muted playsinline></video>
        </div>
        <div class="kolom">
            <h3>Video Peer A</h3>
            <video id="videoJauh" autoplay playsinline></video>
        </div>
    </div>

    <div class="log" id="logPesan"></div>

    <script>
        const SERVER_URL = window.location.origin;
        const ROUTING_ID = 'peer-b';
        const TARGET_ROUTING_ID = 'peer-a';

        let socket, koneksiWebRTC, aliranLokal;
        let antreanCandidateB = [];
        let activeWorker = null;

        const videoLokal = document.getElementById('videoLokal');
        const videoJauh = document.getElementById('videoJauh');
        const status = document.getElementById('status');
        const logPesan = document.getElementById('logPesan');

        function tulisLog(pesan) {
            logPesan.innerHTML += `[${new Date().toLocaleTimeString()}] ${pesan}<br>`;
            logPesan.scrollTop = logPesan.scrollHeight;
        }

        function ubahStatus(teks, jenis = 'info') {
            status.className = `status ${jenis}`;
            status.textContent = teks;
        }

        async function ambilDataRegistrasi(peerId) {
            const resRahasia = await fetch(`${SERVER_URL}/zkp/rahasia-LOKAL-SAJA.json`);
            const semuaRahasia = await resRahasia.json();
            const resPublik = await fetch(`${SERVER_URL}/zkp/registry-publik.json`);
            const semuaPublik = await resPublik.json();

            return {
                nilaiRahasiaPengguna: semuaRahasia[peerId].nilaiRahasiaPengguna,
                hashIdentitasTerdaftar: semuaPublik[peerId].hashIdentitasTerdaftar
            };
        }

        function bersihkanKoneksiLama() {
            if (activeWorker) {activeWorker.terminate(); activeWorker = null;}
            if (socket) {socket.removeAllListeners(); socket.disconnect();}
            if (koneksiWebRTC) {koneksiWebRTC.close(); koneksiWebRTC = null;}
            antreanCandidateB = [];
        }

        async function hubungkanJWT() {
            bersihkanKoneksiLama();
            ubahStatus('Memproses JWT Peer B...', 'info');
            const res = await fetch(`${SERVER_URL}/auth/jwt`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({peerId: ROUTING_ID})
            });
            const data = await res.json();
            socket = io(SERVER_URL, {query: {metode: 'jwt', kredensial: data.token, peerId: ROUTING_ID}});
            siapkanSocket();
        }

        async function hubungkanZKP() {
            bersihkanKoneksiLama();
            ubahStatus('Membuat ZKP Peer B (Worker)...', 'info');

            try {
                const {nilaiRahasiaPengguna, hashIdentitasTerdaftar} = await ambilDataRegistrasi(ROUTING_ID);

                activeWorker = new Worker('/zkp-worker.js');

                activeWorker.postMessage({
                    type: 'GENERATE_PROOF',
                    input: {nilaiRahasiaPengguna, hashIdentitasTerdaftar},
                    wasmPath: `${SERVER_URL}/zkp/circuit_js/circuit.wasm`,
                    zkeyPath: `${SERVER_URL}/zkp/circuit_0000.zkey`
                });

                activeWorker.onmessage = async (e) => {
                    if (e.data.type === 'PROOF_SUCCESS') {
                        const {proof, publicSignals} = e.data.payload;
                        const kredensial = btoa(JSON.stringify({proof, publicSignals}));
                        socket = io(SERVER_URL, {query: {metode: 'zkp', kredensial, peerId: ROUTING_ID}});
                        siapkanSocket();
                    } else if (e.data.type === 'PROOF_ERROR') {
                        ubahStatus('Gagal ZKP: ' + e.data.error, 'gagal');
                    }
                };

                activeWorker.onerror = (err) => {
                    ubahStatus('Worker Error: ' + err.message, 'gagal');
                };

            } catch (err) {
                ubahStatus('Gagal ZKP: ' + err.message, 'gagal');
            }
        }

        function siapkanSocket() {
            socket.on('connect', () => {
                ubahStatus('✅ Terhubung ke server, menunggu offer dari Peer A...', 'sukses');
                tulisLog('Autentikasi BERHASIL!');
            });

            socket.on('offer', async (data) => {
                tulisLog(`Menerima penawaran dari ${data.dari}`);
                await prosesOfferDanJawab(data);
            });

            socket.on('ice-candidate', async (data) => {
                if (data.kandidat) {
                    const cand = new RTCIceCandidate(data.kandidat);
                    if (koneksiWebRTC && koneksiWebRTC.remoteDescription) {
                        await koneksiWebRTC.addIceCandidate(cand);
                    } else {
                        antreanCandidateB.push(cand);
                    }
                }
            });

            socket.on('disconnect', () => {
                ubahStatus('Terputus dari server', 'gagal');
            });
        }

        async function prosesOfferDanJawab(data) {
            try {
                if (!aliranLokal) {
                    aliranLokal = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
                    videoLokal.srcObject = aliranLokal;
                }

                koneksiWebRTC = new RTCPeerConnection({
                    iceServers: [{urls: 'stun:stun.l.google.com:19302'}]
                });

                aliranLokal.getTracks().forEach(track => koneksiWebRTC.addTrack(track, aliranLokal));

                koneksiWebRTC.ontrack = (e) => {
                    videoJauh.srcObject = e.streams[0];
                    tulisLog('🎥 Video diterima dari Peer A');
                };

                koneksiWebRTC.onicecandidate = (e) => {
                    if (e.candidate) socket.emit('ice-candidate', {tujuan: TARGET_ROUTING_ID, kandidat: e.candidate});
                };

                await koneksiWebRTC.setRemoteDescription(new RTCSessionDescription(data.sdp));

                while (antreanCandidateB.length > 0) {
                    const cand = antreanCandidateB.shift();
                    await koneksiWebRTC.addIceCandidate(cand);
                }

                const jawaban = await koneksiWebRTC.createAnswer();
                await koneksiWebRTC.setLocalDescription(jawaban);

                tulisLog('Mengirim jawaban ke Peer A...');
                socket.emit('answer', {tujuan: TARGET_ROUTING_ID, sdp: jawaban});

            } catch (err) {
                tulisLog(`❌ Error Peer B: ${err.message}`);
            }
        }
    </script>
</body>

</html>
