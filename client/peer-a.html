            rtcSedangBerjalan = false;
            antreanCandidate = [];

                const {nilaiRahasiaPengguna, hashIdentitasTerdaftar} = await ambilDataRegistrasi(ROUTING_ID);

                const t0 = performance.now();
                activeWorker = new Worker('/zkp-worker.js');

                activeWorker.postMessage({
                    type: 'GENERATE_PROOF',
                    input: {nilaiRahasiaPengguna, hashIdentitasTerdaftar},
                    wasmPath: `${SERVER_URL}/zkp/circuit_js/circuit.wasm`,
                    zkeyPath: `${SERVER_URL}/zkp/circuit_0000.zkey`

                    if (e.data.type === 'PROOF_SUCCESS') {
                        const {proof, publicSignals} = e.data.payload;
                        const waktuGenerate = performance.now() - t0;
                        const kredensial = btoa(JSON.stringify({proof, publicSignals}));

                        tulisLog(`Bukti ZKP dibuat (${waktuGenerate.toFixed(2)} ms)`);

                        ubahStatus('Gagal ZKP: ' + e.data.error, 'gagal');
                        window.__benchmark.status = 'gagal';
                        window.__benchmark.error = e.data.error;

                    window.__benchmark.error = err.message;
